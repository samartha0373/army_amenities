{% extends "base.html" %}
{% block title %}User Login{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4"><i class="bi bi-box-arrow-in-right me-2"></i>User Login</h2>
            
            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}
            
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="army_no" class="form-label">Army Number</label>
                    <input type="text" class="form-control" id="army_no" name="army_no" required placeholder="Enter your army number">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-modern">Login</button>
                </div>
                
                <div class="text-center mt-3">
                    <p>Don't have an account? <a href="/register" class="text-decoration-none">Register here</a></p>
                    <p class="mt-2"><a href="/store-ic-login" class="text-decoration-none">Store IC Login</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
